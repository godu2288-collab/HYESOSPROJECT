<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYESOSIKI3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background: #000;
            border-bottom: 2px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo img {
            height: 60px;
            width: auto;
            display: block;
        }

        .back-link {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            padding: 10px 18px;
            border: 2px solid #fff;
            border-radius: 10px;
            transition: 0.3s;
        }

        .back-link:hover {
            background: #fff;
            color: #000;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 40px 80px;
        }

        .game-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 60px;
            align-items: start;
        }

        .game-header-cover {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #222;
            aspect-ratio: 16 / 9;
            background: #111;
        }

        .game-header-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .game-header-info h1 {
            font-size: 38px;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .release-date {
            display: inline-block;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .release-date span {
            color: #888;
            margin-right: 6px;
        }

        .game-description {
            color: #bbb;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        /* ===== КНОПКА "СКАЧАТЬ" ===== */
        .btn-download {
            display: inline-block;
            padding: 14px 40px;
            border-radius: 10px;
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-download:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 1px solid #222;
        }

        .screenshots {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        .screenshot {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #222;
            transition: 0.3s;
        }

        .screenshot:hover {
            border-color: #fff;
            transform: scale(1.02);
        }

        .screenshot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        .feature {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 15px;
            padding: 25px;
        }

        .feature h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #fff;
        }

        .feature p {
            color: #999;
            font-size: 14px;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #555;
            border-top: 1px solid #222;
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }

            .logo img {
                height: 45px;
            }

            .container {
                padding: 30px 20px 60px;
            }

            .game-header {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .game-header-info h1 {
                font-size: 28px;
            }

            .section-title {
                font-size: 22px;
            }
        }
    </style>
</head>
